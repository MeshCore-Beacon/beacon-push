{{template "head" "Confirm your server"}}
<h1>Confirm your server</h1>
{{template "error" .Error}}
<form method="post" action="/verify" id="verify">
<input type="hidden" name="token" id="token">
<noscript>
<div class="field">
<label for="token_manual">Paste everything after <code>#token=</code> in the link</label>
<input id="token_manual" name="token_manual" autocomplete="off">
</div>
</noscript>
<p class="lead">Your secret is shown once, on the next page.</p>
<button type="submit">Show my Push ID</button>
</form>
<script src="/static/verify.js"></script>
{{template "foot"}}
